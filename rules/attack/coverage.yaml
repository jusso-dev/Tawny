# ATT&CK coverage map (docs/architecture/target-edr.md section 6).
#
# For each technique: the event types whose telemetry can show it, and the
# response actions that apply to it. Names and tactics come from
# techniques.json, a subset of ATT&CK Enterprise 20.1 (see README.md).
#
# GET /api/attack/coverage reports three states per technique, each from
# its own source and never from another state:
#   telemetry  an agent seen in the last 15 minutes, with no failed sensor,
#              sent one of these event types in the last 24 hours
#   detection  an enabled rule lists the technique (mitre_techniques)
#   response   one of the listed actions is supported on the platform
#
# Keep event types to schemas/events and actions to the ones the agent runs
# (agent/src/response_actions.zig). Platforms limit where an action applies.
attack_version: "20.1"
actions:
  kill_process: [windows, linux, macos]
  suspend_process: [windows, linux, macos]
  quarantine_file: [windows, linux, macos]
  isolate_host: [windows]
