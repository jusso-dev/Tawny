# PostgreSQL + tawny-server + Caddy. Caddy terminates TLS. Zig does not.
# Postgres is not published to the host. Optional agent: --profile agent.
name: tawny

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tawny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tawny
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawny -d tawny"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tawny-server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TAWNY_DATABASE_URL: postgres://tawny:${POSTGRES_PASSWORD}@postgres:5432/tawny
      TAWNY_HTTP_HOST: 0.0.0.0
      TAWNY_HTTP_PORT: "8080"
      TAWNY_APPLY_MIGRATIONS_ON_STARTUP: "true"
      TAWNY_UI_DIR: /srv/tawny/ui
      TAWNY_PUBLIC_URL: ${TAWNY_PUBLIC_URL:-https://localhost:8443}
      TAWNY_BOOTSTRAP_ADMIN_EMAIL: ${TAWNY_BOOTSTRAP_ADMIN_EMAIL:-}
      TAWNY_BOOTSTRAP_ADMIN_PASSWORD: ${TAWNY_BOOTSTRAP_ADMIN_PASSWORD:-}
      TAWNY_INTEGRATION_ENCRYPTION_KEY: ${TAWNY_INTEGRATION_ENCRYPTION_KEY:?set TAWNY_INTEGRATION_ENCRYPTION_KEY}
      TAWNY_AGENT_JWT_SIGNING_KEY_PEM: /run/secrets/tawny-jwt-key
      TAWNY_AGENT_JWT_SEED: ${TAWNY_AGENT_JWT_SEED:?set TAWNY_AGENT_JWT_SEED}
      TAWNY_GITHUB_CLIENT_ID: ${TAWNY_GITHUB_CLIENT_ID:-}
      TAWNY_GITHUB_CLIENT_SECRET: ${TAWNY_GITHUB_CLIENT_SECRET:-}
      TAWNY_SLACK_WEBHOOK_URL: ${TAWNY_SLACK_WEBHOOK_URL:-}
      TAWNY_WAZUH_HOST: ${TAWNY_WAZUH_HOST:-}
      TAWNY_WAZUH_PORT: ${TAWNY_WAZUH_PORT:-514}
      TAWNY_WAZUH_PROTOCOL: ${TAWNY_WAZUH_PROTOCOL:-udp}
      TAWNY_VIRUSTOTAL_API_KEY: ${TAWNY_VIRUSTOTAL_API_KEY:-}
      TAWNY_ABUSEIPDB_API_KEY: ${TAWNY_ABUSEIPDB_API_KEY:-}
      TAWNY_GREYNOISE_API_KEY: ${TAWNY_GREYNOISE_API_KEY:-}
      TAWNY_AI_ENABLED: ${TAWNY_AI_ENABLED:-false}
      TAWNY_AI_MODEL_ENDPOINT: ${TAWNY_AI_MODEL_ENDPOINT:-http://localhost:11434/v1}
      TAWNY_AI_MODEL_NAME: ${TAWNY_AI_MODEL_NAME:-qwen2.5:7b-instruct}
      TAWNY_AI_MODEL_API_KEY: ${TAWNY_AI_MODEL_API_KEY:-}
      TAWNY_AI_CONFIDENCE_THRESHOLD: ${TAWNY_AI_CONFIDENCE_THRESHOLD:-0.70}
      TAWNY_AI_ALLOW_PRIVATE_EGRESS: ${TAWNY_AI_ALLOW_PRIVATE_EGRESS:-true}
      TAWNY_BACKUP_S3_BUCKET: ${TAWNY_BACKUP_S3_BUCKET:-}
      TAWNY_BACKUP_LOCAL_PATH: ${TAWNY_BACKUP_LOCAL_PATH:-off}
      TAWNY_ALLOW_PRIVATE_EGRESS: ${TAWNY_ALLOW_PRIVATE_EGRESS:-}
    secrets:
      - source: tawny_jwt_key
        target: tawny-jwt-key
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    healthcheck:
      test: ["CMD", "/tawny-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  caddy:
    image: caddy:2
    depends_on:
      tawny-server:
        condition: service_healthy
    environment:
      TAWNY_DOMAIN: ${TAWNY_DOMAIN:-localhost}
    ports:
      - "${TAWNY_HTTP_PORT:-8080}:80"
      - "${TAWNY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  agent:
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
    profiles:
      - agent
    depends_on:
      tawny-server:
        condition: service_healthy
    environment:
      TAWNY_CONFIG: /etc/tawny/config.toml
      TAWNY_AGENT_BACKEND_URL: http://tawny-server:8080
      TAWNY_AGENT_ALLOW_INSECURE_HTTP: "true"
      TAWNY_AGENT_ENROLLMENT_TOKEN: ${TAWNY_AGENT_ENROLLMENT_TOKEN:-}
      TAWNY_AGENT_HEARTBEAT_INTERVAL_SECONDS: ${TAWNY_AGENT_HEARTBEAT_INTERVAL_SECONDS:-15}
      TAWNY_AGENT_PROCESS_INTERVAL_SECONDS: ${TAWNY_AGENT_PROCESS_INTERVAL_SECONDS:-15}
      TAWNY_AGENT_NETWORK_INTERVAL_SECONDS: ${TAWNY_AGENT_NETWORK_INTERVAL_SECONDS:-15}
      TAWNY_AGENT_USERS_INTERVAL_SECONDS: ${TAWNY_AGENT_USERS_INTERVAL_SECONDS:-60}
      TAWNY_AGENT_SYSTEM_INTERVAL_SECONDS: ${TAWNY_AGENT_SYSTEM_INTERVAL_SECONDS:-60}
      TAWNY_AGENT_FIM_INTERVAL_SECONDS: ${TAWNY_AGENT_FIM_INTERVAL_SECONDS:-30}
      TAWNY_AGENT_FIM_PATHS: ${TAWNY_AGENT_FIM_PATHS:-/etc/hosts,/var/lib/tawny/watch.txt}
    volumes:
      - agent-state:/etc/tawny
      - agent-data:/var/lib/tawny
    restart: unless-stopped

secrets:
  tawny_jwt_key:
    file: ./secrets/tawny-jwt-key

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  agent-state:
  agent-data:
