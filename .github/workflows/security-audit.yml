name: security audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zig dependency check
        id: findings
        run: |
          set -euo pipefail
          : > zig-audit.txt
          found=false
          for zon in agent/build.zig.zon server/build.zig.zon; do
            if grep -q '.dependencies = .{}' "$zon"; then
              echo "$zon: no third-party Zig dependencies" >> zig-audit.txt
            else
              echo "$zon: dependencies are declared; review them" >> zig-audit.txt
              found=true
            fi
          done
          if [ "$found" = "false" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "Weekly dependency audit found actionable items."
            echo
            echo "## Zig"
            echo '```'
            cat zig-audit.txt
            echo '```'
          } > audit-issue.md
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: open issue for findings
        if: steps.findings.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly dependency audit findings - $(date -u +%Y-%m-%d)" \
            --body-file audit-issue.md
