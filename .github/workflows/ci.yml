name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (.NET 10)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DevPassw0rd!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'DevPassw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      ConnectionStrings__Default: "Server=localhost,1433;Database=TawnyCi;User Id=sa;Password=DevPassw0rd!;TrustServerCertificate=True;Encrypt=False"
      Tawny__AgentJwt__SigningKeyPem: ""
      Tawny__AgentJwt__RequireConfiguredSigningKey: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: apply migrations to SQL Server
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          ~/.dotnet/tools/dotnet-ef database update --project src/Tawny.Infrastructure --startup-project src/Tawny.Api
      - run: dotnet test --configuration Release --no-build --verbosity normal

  web:
    name: web (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # Native build + unit tests on real Windows / macOS / Linux runners.
  # Proves platform collectors and the binary actually run, not just cross-compile.
  agent:
    name: agent (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      ZIG_VERSION: "0.16.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            zig_triple: x86_64-linux
            archive_ext: tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            binary_ext: ""
          - name: windows-x64
            os: windows-latest
            zig_triple: x86_64-windows
            archive_ext: zip
            sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
            binary_ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            zig_triple: aarch64-macos
            archive_ext: tar.xz
            sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            binary_ext: ""
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: install Zig
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          zig_version="${ZIG_VERSION}"
          triple="${{ matrix.zig_triple }}"
          ext="${{ matrix.archive_ext }}"
          sha256="${{ matrix.sha256 }}"
          archive="$RUNNER_TEMP/zig-${triple}.${ext}"
          zig_dir="$RUNNER_TEMP/zig-${zig_version}"
          url="https://ziglang.org/download/${zig_version}/zig-${triple}-${zig_version}.${ext}"

          # Keep flags portable: Windows ships curl.exe, not GNU curl.
          curl -fsSL --retry 3 "$url" -o "$archive"

          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sha256}  ${archive}" | sha256sum -c -
          else
            echo "${sha256}  ${archive}" | shasum -a 256 -c -
          fi

          mkdir -p "$zig_dir"
          if [[ "$ext" == "zip" ]]; then
            # Windows zip layout: zig-<triple>-<version>/zig.exe
            # Python is on every GitHub-hosted runner and avoids bash/unzip path issues.
            python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              "$archive" "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/zig-${triple}-${zig_version}"/* "$zig_dir/"
          else
            tar -xJf "$archive" -C "$zig_dir" --strip-components=1
          fi

          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: test
        run: zig build test
      - name: smoke-run binary
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bin="zig-out/bin/tawny-agent${{ matrix.binary_ext }}"
          test -f "$bin"
          # Binary always prints the start banner, then exits without enrollment
          # token (default config has no agent_id). Capture output and assert.
          set +e
          out="$("$bin" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "tawny-agent 0.1.0 starting"
          test "$status" -ne 0
      - name: test installer upgrade and recovery paths
        if: matrix.name == 'linux-x64'
        run: bash install/test-install.sh
      - name: package CI artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "zig-out/bin/tawny-agent${{ matrix.binary_ext }}" \
            "dist/tawny-agent-${{ matrix.name }}${{ matrix.binary_ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tawny-agent-${{ matrix.name }}
          path: agent/dist/
          if-no-files-found: error
          retention-days: 7

  # Cross-compile remaining release targets (no native runner for these).
  agent-cross:
    name: agent-cross (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-arm64, zig: aarch64-linux-gnu, ext: "" }
          - { name: macos-x64, zig: x86_64-macos, ext: "" }
          # windows-x64 / linux-x64 / macos-arm64 covered by native agent job
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: install Zig
        run: |
          set -euo pipefail
          zig_dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$zig_dir"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$zig_dir" --strip-components=1
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
      - name: build
        run: zig build -Dtarget=${{ matrix.target.zig }} -Doptimize=ReleaseSmall
      - name: package CI artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "zig-out/bin/tawny-agent${{ matrix.target.ext }}" \
            "dist/tawny-agent-${{ matrix.target.name }}${{ matrix.target.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tawny-agent-cross-${{ matrix.target.name }}
          path: agent/dist/
          if-no-files-found: error
          retention-days: 7
