name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (.NET 10)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DevPassw0rd!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'DevPassw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      ConnectionStrings__Default: "Server=localhost,1433;Database=TawnyCi;User Id=sa;Password=DevPassw0rd!;TrustServerCertificate=True;Encrypt=False"
      Tawny__AgentJwt__SigningKeyPem: ""
      Tawny__AgentJwt__RequireConfiguredSigningKey: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: apply migrations to SQL Server
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          ~/.dotnet/tools/dotnet-ef database update --project src/Tawny.Infrastructure --startup-project src/Tawny.Api
      - run: dotnet test --configuration Release --no-build --verbosity normal

  web:
    name: web (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  agent:
    name: agent (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.16.0
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: windows-x64, zig: x86_64-windows-gnu, ext: ".exe" }
          - { name: linux-x64, zig: x86_64-linux-gnu, ext: "" }
          - { name: linux-arm64, zig: aarch64-linux-gnu, ext: "" }
          - { name: macos-arm64, zig: aarch64-macos, ext: "" }
          - { name: macos-x64, zig: x86_64-macos, ext: "" }
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: install Zig
        run: |
          set -euo pipefail
          zig_dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$zig_dir"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$zig_dir" --strip-components=1
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
      - name: build
        run: zig build -Dtarget=${{ matrix.target.zig }} -Doptimize=ReleaseSmall
      - name: test
        if: matrix.target.name == 'linux-x64'
        run: zig build test -Dtarget=x86_64-linux-musl
      - name: package CI artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "zig-out/bin/tawny-agent${{ matrix.target.ext }}" \
            "dist/tawny-agent-${{ matrix.target.name }}${{ matrix.target.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tawny-agent-${{ matrix.target.name }}
          path: agent/dist/
          if-no-files-found: error
          retention-days: 7
