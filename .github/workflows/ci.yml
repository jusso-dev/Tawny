name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: tawny-server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tawny
          POSTGRES_PASSWORD: tawny
          POSTGRES_DB: tawny
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tawny -d tawny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TAWNY_DATABASE_URL: postgres://tawny:tawny@localhost:5432/tawny
      TAWNY_BOOTSTRAP_ADMIN_EMAIL: admin@tawny.local
      TAWNY_BOOTSTRAP_ADMIN_PASSWORD: contract-password
      TAWNY_INTEGRATION_ENCRYPTION_KEY: test-integration-encryption-key
      TAWNY_HTTP_HOST: 127.0.0.1
      TAWNY_HTTP_PORT: "18080"
      TAWNY_PUBLIC_URL: http://127.0.0.1:18080
      TAWNY_ENRICH_ALERTS: "off"
      TAWNY_BACKUP_LOCAL_PATH: "off"
      TAWNY_CONTRACT_AUTH: session
      TAWNY_BASE_URL: http://127.0.0.1:18080
      TAWNY_CONTRACT_EMAIL: admin@tawny.local
      TAWNY_CONTRACT_PASSWORD: contract-password
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: install Zig 0.17.0
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          zig_version=0.17.0
          sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          archive="$RUNNER_TEMP/zig.tar.xz"
          zig_dir="$RUNNER_TEMP/zig-$zig_version"
          curl -fsSL --retry 3 \
            "https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz" \
            -o "$archive"
          echo "${sha256}  ${archive}" | sha256sum -c -
          mkdir -p "$zig_dir"
          tar -xJf "$archive" -C "$zig_dir" --strip-components=1
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
      - name: zig test
        run: zig test src/main.zig -lc
      - name: contract suite
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd server
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/tawny-server serve > "$RUNNER_TEMP/tawny-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tawny-server.pid"
          cd ..
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python3 contract-tests/suite.py
          kill "$(cat "$RUNNER_TEMP/tawny-server.pid")" || true

  # Native build + unit tests on real Windows / macOS / Linux runners.
  # Proves platform collectors and the binary actually run, not just cross-compile.
  agent:
    name: agent (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      ZIG_VERSION: "0.17.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            zig_triple: x86_64-linux
            archive_ext: tar.xz
            sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            binary_ext: ""
          - name: windows-x64
            os: windows-latest
            zig_triple: x86_64-windows
            archive_ext: zip
            sha256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
            binary_ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            zig_triple: aarch64-macos
            archive_ext: tar.xz
            sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
            binary_ext: ""
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: install Zig
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          zig_version="${ZIG_VERSION}"
          triple="${{ matrix.zig_triple }}"
          ext="${{ matrix.archive_ext }}"
          sha256="${{ matrix.sha256 }}"
          archive="$RUNNER_TEMP/zig-${triple}.${ext}"
          zig_dir="$RUNNER_TEMP/zig-${zig_version}"
          url="https://ziglang.org/download/${zig_version}/zig-${triple}-${zig_version}.${ext}"

          # Keep flags portable: Windows ships curl.exe, not GNU curl.
          curl -fsSL --retry 3 "$url" -o "$archive"

          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sha256}  ${archive}" | sha256sum -c -
          else
            echo "${sha256}  ${archive}" | shasum -a 256 -c -
          fi

          mkdir -p "$zig_dir"
          if [[ "$ext" == "zip" ]]; then
            # Windows zip layout: zig-<triple>-<version>/zig.exe
            # Python is on every GitHub-hosted runner and avoids bash/unzip path issues.
            python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              "$archive" "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/zig-${triple}-${zig_version}"/* "$zig_dir/"
          else
            tar -xJf "$archive" -C "$zig_dir" --strip-components=1
          fi

          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: test
        run: zig build test
      - name: smoke-run binary
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bin="zig-out/bin/tawny-agent${{ matrix.binary_ext }}"
          test -f "$bin"
          # Binary always prints the start banner, then exits without enrollment
          # token (default config has no agent_id). Capture output and assert.
          set +e
          out="$("$bin" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "tawny-agent 0.1.0 starting"
          test "$status" -ne 0
      - name: test installer upgrade and recovery paths
        if: matrix.name == 'linux-x64'
        run: bash install/test-install.sh
      - name: package CI artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "zig-out/bin/tawny-agent${{ matrix.binary_ext }}" \
            "dist/tawny-agent-${{ matrix.name }}${{ matrix.binary_ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tawny-agent-${{ matrix.name }}
          path: agent/dist/
          if-no-files-found: error
          retention-days: 7

  # Cross-compile remaining release targets (no native runner for these).
  agent-cross:
    name: agent-cross (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: "0.17.0"
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-arm64, zig: aarch64-linux-gnu, ext: "" }
          - { name: macos-x64, zig: x86_64-macos, ext: "" }
          # windows-x64 / linux-x64 / macos-arm64 covered by native agent job
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: install Zig
        run: |
          set -euo pipefail
          zig_dir="$RUNNER_TEMP/zig-$ZIG_VERSION"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$zig_dir"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$zig_dir" --strip-components=1
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
      - name: build
        run: zig build -Dtarget=${{ matrix.target.zig }} -Doptimize=ReleaseSmall
      - name: package CI artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "zig-out/bin/tawny-agent${{ matrix.target.ext }}" \
            "dist/tawny-agent-${{ matrix.target.name }}${{ matrix.target.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tawny-agent-cross-${{ matrix.target.name }}
          path: agent/dist/
          if-no-files-found: error
          retention-days: 7
